services:
  cloudflare:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:20241", --url, "http://api:80"]
    ports:
      - "127.0.0.1:20242:20241"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
