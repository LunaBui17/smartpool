ProxyRequests Off
# Keep the v2 Bearer token available to PHP (Apache may consume Authorization).
SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1
# HTTPS terminates at Cloudflare. Apache forwards WebSocket upgrades internally.
ProxyPass "/mqtt" "http://mqtt:9001/mqtt" upgrade=websocket retry=0 timeout=300
ProxyPassReverse "/mqtt" "http://mqtt:9001/mqtt"
RedirectMatch 302 "^/$" "/pool_api/pool_api.php"
